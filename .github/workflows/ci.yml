name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 5 * * 2"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx vue-tsc -b
      - run: npm test
      - run: npm run build

      - name: Required documentation
        shell: bash
        run: |
          for file in README.md ARCHITECTURE.md BUILDING.md INSTALLATION.md \
            SUPPORTED_DEVICES.md TROUBLESHOOTING.md CONTRIBUTING.md SECURITY.md \
            CHANGELOG.md PROJECT_AUDIT.md LICENSE NOTICE.md; do
            test -s "$file" || { echo "missing or empty: $file"; exit 1; }
          done

  rust:
    name: Rust checks and tests (GNU)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msys2-bootstrapping: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Use GNU toolchain
        run: rustup default stable-x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: bash scripts/test-rust.sh

  security:
    name: Advisories
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-audit

      - run: cargo audit --file src-tauri/Cargo.lock

  tauri:
    name: Tauri build (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tauri build
