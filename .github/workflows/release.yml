name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$tag" = "$version" || { echo "tag $tag does not match version $version"; exit 1; }

      - run: npm ci
      - run: npx tauri build

      - name: Portable package
        shell: pwsh
        run: |
          $stage = "portable/Universal Device Manager"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/udm.exe" "$stage/Universal Device Manager.exe"
          Copy-Item "src-tauri/target/release/WebView2Loader.dll" $stage
          Copy-Item README.md, LICENSE, NOTICE.md $stage
          Compress-Archive -Path $stage -DestinationPath "portable/UDM-${{ github.ref_name }}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            portable/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            portable/*.zip
